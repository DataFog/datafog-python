name: CI

on:
  push:
    branches: [main, dev, "feature/*", "fix/*", "chore/*", "cleanup/*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-bridge:
    name: Rust bridge (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel with native extra
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "import glob, subprocess, sys; wheel = glob.glob('dist/*.whl')[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel + '[test,cli,rust]'])"
      - name: Verify installed package outside checkout imports
        run: python -I scripts/check_rust_install.py
      - name: Test compatibility, routing, preview and native parity
        run: python -m pytest tests/test_contract_481.py tests/test_rust_backend.py tests/test_api_bridge_49.py tests/test_rust_contract.py tests/test_core_capability_adapter.py tests/test_core04_integration.py -q
      - name: Generate native parity report
        run: python -m tests.rust_contract --output rust-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-parity-${{ matrix.os }}-${{ matrix.python-version }}
          path: rust-parity.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        install-profile: ["core", "nlp", "nlp-advanced"]
        exclude:
          - python-version: "3.14"
            install-profile: nlp
          - python-version: "3.14"
            install-profile: nlp-advanced
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies (core)
        if: matrix.install-profile == 'core'
        run: |
          pip install -e ".[test,cli]" -r requirements-test.txt

      - name: Install dependencies (nlp)
        if: matrix.install-profile == 'nlp'
        run: |
          pip install -e ".[test,cli,nlp]" -r requirements-test.txt
          python -m spacy download en_core_web_lg

      - name: Install dependencies (nlp-advanced)
        if: matrix.install-profile == 'nlp-advanced'
        run: |
          pip install -e ".[test,cli,nlp,nlp-advanced]" -r requirements-test.txt
          pip install "litellm>=1.90,<2" fastapi  # exercises the LiteLLM guardrail adapter tests (proxy deployments always have fastapi)
          pip install "sentry-sdk>=2.35,<3"  # exercises the Sentry integration adapter tests (2.35+ for before_send_log)
          python -m spacy download en_core_web_lg
          datafog download-model urchade/gliner_multi_pii-v1 --engine gliner

      - name: Run tests (core)
        if: matrix.install-profile == 'core'
        run: |
          pytest tests/ \
            -m "not slow" \
            --ignore=tests/test_gliner_annotator.py \
            --ignore=tests/test_image_service.py \
            --ignore=tests/test_ocr_integration.py \
            --ignore=tests/test_spark_integration.py \
            --ignore=tests/test_text_service_integration.py \
            --cov=datafog \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Run tests (nlp)
        if: matrix.install-profile == 'nlp'
        run: |
          pytest tests/ \
            -m "not slow" \
            --ignore=tests/test_gliner_annotator.py \
            --ignore=tests/test_image_service.py \
            --ignore=tests/test_ocr_integration.py \
            --ignore=tests/test_spark_integration.py \
            --cov=datafog \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Run tests (nlp-advanced)
        if: matrix.install-profile == 'nlp-advanced'
        run: |
          pytest tests/ \
            -m "not slow" \
            --ignore=tests/test_detection_accuracy.py \
            --ignore=tests/test_image_service.py \
            --ignore=tests/test_ocr_integration.py \
            --ignore=tests/test_spark_integration.py \
            --cov=datafog \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Run detection accuracy corpus
        if: matrix.python-version == '3.11' && matrix.install-profile == 'nlp-advanced'
        run: |
          pytest tests/test_detection_accuracy.py \
            -v --tb=short \
            --cov=datafog \
            --cov-branch \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Enforce coverage thresholds
        if: matrix.python-version == '3.11' && matrix.install-profile == 'nlp-advanced'
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0))
          branch_rate = float(root.attrib.get("branch-rate", 0.0))
          line_pct = line_rate * 100
          branch_pct = branch_rate * 100

          print(f"Line coverage: {line_pct:.2f}%")
          print(f"Branch coverage: {branch_pct:.2f}%")

          if line_pct < 85:
              print("Line coverage below 85% threshold.")
              sys.exit(1)
          if branch_pct < 75:
              print("Branch coverage below 75% threshold.")
              sys.exit(1)
          PY

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: ${{ matrix.install-profile }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  profile-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        install-profile:
          - core
          - cli
          - nlp
          - nlp-advanced
          - ocr
          - distributed
          - web
        include:
          - python-version: "3.14"
            install-profile: core
          - python-version: "3.14"
            install-profile: cli
          - python-version: "3.13"
            install-profile: nlp
          - python-version: "3.13"
            install-profile: nlp-advanced
          - python-version: "3.13"
            install-profile: ocr
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Tesseract OCR
        if: matrix.install-profile == 'ocr'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install dependencies (core)
        if: matrix.install-profile == 'core'
        run: |
          pip install -e ".[test]"

      - name: Install dependencies (profile)
        if: matrix.install-profile != 'core'
        run: |
          pip install -e ".[test,${{ matrix.install-profile }}]"

      - name: Run install profile smoke test
        env:
          DATAFOG_INSTALL_PROFILE: ${{ matrix.install-profile }}
          DATAFOG_REQUIRE_TESSERACT: ${{ matrix.install-profile == 'ocr' && '1' || '' }}
        run: |
          pytest tests/test_install_profiles.py -q

  wheel-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Check wheel size
        run: python scripts/check_wheel_size.py
